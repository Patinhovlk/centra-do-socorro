<script>
    let configAtendentes = JSON.parse(localStorage.getItem('vampirao_contatos')) || [{ nome: "PRINCIPAL", numero: "5511992512161" }];
    let totalPedidosGeral = JSON.parse(localStorage.getItem('vampirao_total')) || 0;

    function fecharModais() { document.getElementById('modalConfig').style.display='none'; document.getElementById('overlay').style.display='none'; }
    function abrirConfig() { document.getElementById('modalConfig').style.display='block'; document.getElementById('overlay').style.display='block'; renderizarCamposConfig(); }

    function renderizarCamposConfig() {
        const container = document.getElementById('listaContatosConfig');
        container.innerHTML = '';
        configAtendentes.forEach((contato, index) => {
            container.innerHTML += `<input type="text" placeholder="Nome" value="${contato.nome}" onchange="configAtendentes[${index}].nome=this.value">
                                    <input type="text" placeholder="5511..." value="${contato.numero}" onchange="configAtendentes[${index}].numero=this.value">`;
        });
    }

    function adicionarCampoContato() { configAtendentes.push({ nome: "", numero: "" }); renderizarCamposConfig(); }
    function salvarConfig() { localStorage.setItem('vampirao_contatos', JSON.stringify(configAtendentes)); fecharModais(); }

    function marcarComoEnviado(btn) {
        btn.classList.remove('btn-automatico');
        btn.classList.add('btn-clicado');
        btn.innerHTML = "✓ DIRECIONADO";
    }

    function iniciarTimer(id, elementoTimer, card, linkZap) {
        let tempo = 40 * 60; 
        let enviadoAuto = false;

        let intervalo = setInterval(() => {
            let minutos = Math.floor(tempo / 60);
            let segundos = tempo % 60;
            elementoTimer.innerHTML = `⏳ LIMITE: ${minutos}:${segundos < 10 ? '0' : ''}${segundos} <span id="auto-status-${id}" class="status-auto-label">ENVIADO AUTOMATICAMENTE</span>`;
            
            if (tempo === 30 * 60 && !enviadoAuto) {
                enviadoAuto = true;
                const statusLabel = document.getElementById(`auto-status-${id}`);
                if(statusLabel) statusLabel.style.display = "inline";
                const botoes = card.querySelectorAll('.btn-zap');
                botoes.forEach(b => {
                    if(!b.classList.contains('btn-clicado')) {
                        b.classList.add('btn-automatico');
                        b.innerHTML = "⚡ ENVIO AUTOMÁTICO";
                    }
                });
                window.open(linkZap, '_blank');
            }

            if (tempo <= 5 * 60) {
                card.style.borderColor = "var(--vermelho)";
                elementoTimer.classList.add('urgente');
            }

            if (tempo <= 0) {
                clearInterval(intervalo);
                elementoTimer.innerText = "❌ TEMPO EXCEDIDO!";
            }
            tempo--;
        }, 1000);
    }

    const source = new EventSource('https://ntfy.sh/central_socorro_vampirao_ios/sse');
    source.onmessage = (e) => {
        const eventData = JSON.parse(e.data);
        if(!eventData.message) return;

        // --- CORREÇÃO AQUI: TRATAMENTO DE DADOS BRUTOS ---
        let p;
        try {
            // Tenta ler como objeto, se vier como string pura ele trata
            p = typeof eventData.message === 'string' ? JSON.parse(eventData.message) : eventData.message;
        } catch(err) {
            console.log("Erro ao processar dados, tentando modo texto...");
            p = eventData; // fallback
        }
        
        totalPedidosGeral++;
        localStorage.setItem('vampirao_total', totalPedidosGeral);

        new Audio('https://www.myinstants.com/media/sounds/whatsapp-notification.mp3').play();

        const agora = new Date();
        const horaAtual = agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        const dataHoraTexto = agora.toLocaleDateString('pt-BR') + " às " + horaAtual;
        
        // MAPEAMENTO REFORÇADO (Garante que se vier vazio, não quebre o layout)
        const nomeFinal = p.nome || "Cliente";
        const telFinal = p.tel || p.telefone || "N/A";
        const emailFinal = p.email || p.Email || "Não informado";
        const endFinal = p.end || p.endereco || "Não informado";
        const veicFinal = p.veic || p.veiculo || "N/A";
        const anoFinal = p.ano || p.ano_veic || p.Ano || "N/A";
        const ampFinal = p.amp || p.amperagem || "N/A";
        const servicoFinal = p.tipo_servico || p.servico || "Troca de Bateria";

        const item = document.createElement('div');
        item.className = 'card-pedido';
        item.id = `pedido-${totalPedidosGeral}`;
        
        let msgZap = `🔋 *PEDIDO DE BATERIA* - CENTRAL DO SOCORRO 🚨\n\n👤 *CLIENTE:* ${nomeFinal}\n📞 *CONTATO:* ${telFinal}\n📧 *E-MAIL:* ${emailFinal}\n📍 *ENDEREÇO:* ${endFinal}\n🛠️ *SERVIÇO:* ${servicoFinal}\n🚗 *VEÍCULO:* ${veicFinal} (${anoFinal})\n⚡ *AMPERAGEM:* ${ampFinal}\n\n⏱️ *HORA DO PEDIDO:* ${horaAtual}\n⏱️ *PREVISÃO:* 40 MINUTOS.\n\n*MANDAR O ORÇAMENTO PARA O CLIENTE O MAIS BREVE POSSÍVEL*`;

        let botoesHtml = '';
        let primeiroLink = "";
        configAtendentes.forEach((c, idx) => {
            if(c.numero) {
                let link = `https://wa.me/${c.numero}?text=${encodeURIComponent(msgZap)}`;
                if(idx === 0) primeiroLink = link;
                botoesHtml += `<a class="btn-zap" onclick="marcarComoEnviado(this)" href="${link}" target="_blank">ENVIAR PARA ${c.nome}</a>`;
            }
        });

        item.innerHTML = `
            <div class="num-pedido">#${totalPedidosGeral}</div>
            <div class="timer-container" id="timer-${totalPedidosGeral}">⏳ LIMITE: 40:00</div>
            
            <div class="info-grid">
                <div class="info-item"><b>CLIENTE:</b> ${nomeFinal}</div>
                <div class="info-item"><b>TEL:</b> ${telFinal}</div>
                <div class="info-item"><b>E-MAIL:</b> ${emailFinal}</div>
                <div class="info-item"><b>SERVIÇO:</b> ${servicoFinal}</div>
                <div class="info-item"><b>ENDEREÇO:</b> ${endFinal}</div>
                <div class="info-item"><b>VEÍCULO:</b> ${veicFinal} | ${anoFinal}</div>
                <div class="info-item"><b>AMPERAGEM:</b> ${ampFinal}</div>
            </div>
            <div class="data-registro">🕒 Pedido feito em: ${dataHoraTexto}</div>
            <div class="botoes-direcionar">${botoesHtml}</div>
        `;
        
        const lista = document.getElementById('lista');
        if(lista.innerHTML.includes("Aguardando")) lista.innerHTML = "";
        lista.prepend(item);

        iniciarTimer(totalPedidosGeral, document.getElementById(`timer-${totalPedidosGeral}`), item, primeiroLink);
    };
</script>
